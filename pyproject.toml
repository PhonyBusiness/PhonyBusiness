[project]
name = "phonybusiness"
version = "0.1.0"
description = "Opt-in voice scam simulation and awareness training."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
    "pymongo>=4.10,<5",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
